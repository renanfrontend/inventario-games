<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perceptron AND | Estudo de caso</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #64748b;
        --paper: #f4f7fb;
        --surface: #ffffff;
        --accent: #f97316;
        --line: #d9e1ec;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: linear-gradient(135deg, #e9eef7 0%, #fff8ef 100%);
        font-family: Georgia, "Times New Roman", serif;
      }

      .page {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font: 700 0.78rem/1.2 Arial, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }
      h1 { max-width: 680px; margin-bottom: 12px; font-size: clamp(2.2rem, 6vw, 4.8rem); line-height: 0.98; }
      header p { max-width: 620px; margin-bottom: 0; color: var(--muted); font: 1.05rem/1.6 Arial, sans-serif; }

      .tag {
        flex: 0 0 auto;
        padding: 10px 14px;
        border: 1px solid #f6b37e;
        border-radius: 999px;
        background: #fff6ed;
        color: #a8460b;
        font: 700 0.78rem Arial, sans-serif;
        text-transform: uppercase;
      }

      .intro, #painel {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        box-shadow: 0 16px 45px #17203312;
      }

      .intro {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        margin-bottom: 20px;
        overflow: hidden;
        border-radius: 10px;
        background: var(--line);
      }

      .intro div { padding: 18px 20px; background: var(--surface); }
      .intro strong { display: block; margin-bottom: 5px; font: 700 0.78rem Arial, sans-serif; color: var(--muted); text-transform: uppercase; }
      .intro span { font-size: 1.1rem; }

      #painel {
        max-width: none !important;
        margin: 0 !important;
        padding: 28px;
        border-radius: 10px;
        color: var(--ink) !important;
        background: var(--surface) !important;
        font-family: Arial, sans-serif !important;
      }

      #painel h1 { margin: 0 0 8px; font: 700 1.5rem Arial, sans-serif; }
      #painel h2 { margin: 28px 0 12px; font: 700 1rem Arial, sans-serif; }
      #painel canvas { display: block; max-width: 100%; height: auto; border: 1px solid #edf0f5; }
      #painel table { font-size: 0.92rem; }
      #painel th { padding: 10px 6px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; }
      #painel td { padding: 10px 6px; }

      @media (max-width: 640px) {
        .page { width: min(100% - 20px, 1040px); padding: 28px 0; }
        header { display: block; }
        .tag { display: inline-block; margin-top: 18px; }
        .intro { grid-template-columns: 1fr; }
        #painel { padding: 18px 12px; overflow: hidden; }
        #painel table { font-size: 0.78rem; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <p class="eyebrow">Processamento de dados massivos e módulos de aprendizado</p>
          <h1>Perceptron para a porta lógica AND</h1>
          <p>Visualização do treinamento, das previsões finais e da validação de um perceptron simples.</p>
        </div>
        <span class="tag">Estudo de caso</span>
      </header>

      <section class="intro" aria-label="Resumo do experimento">
        <div><strong>Modelo</strong><span>Perceptron simples</span></div>
        <div><strong>Entradas</strong><span>4 combinações AND</span></div>
        <div><strong>Treinamento</strong><span>20 épocas</span></div>
      </section>

      <div id="app"></div>
    </main>

    <script src="./perceptron_and.js"></script>
  </body>
</html>
